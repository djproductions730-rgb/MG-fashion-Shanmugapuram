<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG Fashion - Premium Collection</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Montserrat', sans-serif; background-color: #121212; color: #ffffff; margin: 0; text-align: center; }
      .header { background: linear-gradient(90deg, #3a0d16, #801a26); padding: 20px; display: flex; align-items: center; justify-content: center; gap: 15px; border-bottom: 3px solid #d4af37; }
      .logo { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #d4af37; }
      h1 { font-family: 'Playfair Display', serif; color: #d4af37; margin: 0; letter-spacing: 2px; }
      .banner { width: 100%; height: 250px; object-fit: cover; opacity: 0.7; }
      .container { max-width: 450px; margin: -50px auto 40px; padding: 30px; background: #1e1e1e; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.7); position: relative; border: 1px solid #333; }
      h2 { color: #d4af37; font-family: 'Playfair Display', serif; margin-bottom: 5px; }
      .subtitle { color: #bbb; font-size: 14px; margin-bottom: 20px; }
      input, select { width: 90%; padding: 12px; margin: 12px 0; border-radius: 6px; border: 1px solid #444; background-color: #2c2c2c; color: white; font-size: 15px; }
      input:focus, select:focus { outline: none; border-color: #d4af37; }
      button { width: 95%; padding: 14px; background: linear-gradient(45deg, #b8860b, #d4af37); color: #121212; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 15px; transition: 0.3s; }
      button:hover { background: linear-gradient(45deg, #d4af37, #ffcc33); }
      #message { margin-top: 15px; font-weight: bold; font-size: 15px; }
    </style>
  </head>
  <body>
    
    <div class="header">
      <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=150&q=80" alt="Logo" class="logo">
      <h1>MG FASHION</h1>
    </div>

    <img src="https://images.unsplash.com/photo-1441984904996-e0b6ba687e04?w=1200&q=80" alt="Banner" class="banner">

    <div class="container">
      <h2>Place Your Order</h2>
      <p class="subtitle">Exclusive Designer Collections</p>
      
      <form id="orderForm">
        <input type="text" name="customerName" placeholder="Customer Name" required>
        <input type="tel" name="mobileNumber" placeholder="Mobile Number" required>
        <input type="text" name="productName" placeholder="Dress Name" required>
        
        <select name="size" required>
          <option value="" disabled selected>Select Size</option>
          <option value="S">Small (S)</option>
          <option value="M">Medium (M)</option>
          <option value="L">Large (L)</option>
          <option value="XL">Extra Large (XL)</option>
        </select>

        <button type="submit" id="submitBtn">Submit Order</button>
      </form>

      <p id="message"></p>
    </div>

    <script>
      const scriptURL = 'YOUR_GOOGLE_WEB_APP_URL_HERE'; 
      
      const form = document.getElementById('orderForm');
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('message');

      form.addEventListener('submit', e => {
        e.preventDefault();
        btn.innerText = "Processing...";
        btn.disabled = true;
        msg.innerText = "Saving your order...";
        msg.style.color = "#d4af37";

        const formData = new FormData(form);
        formData.append("action", "order"); 

        fetch(scriptURL, { method: 'POST', body: formData })
          .then(response => {
            msg.innerText = "Order placed successfully! Data saved.";
            msg.style.color = "#4caf50";
            form.reset();
            btn.innerText = "Submit Order";
            btn.disabled = false;
          })
          .catch(error => {
            msg.innerText = "Error! Please try again.";
            msg.style.color = "red";
            btn.innerText = "Submit Order";
            btn.disabled = false;
          });
      });
    </script>
  </body>
</html>
